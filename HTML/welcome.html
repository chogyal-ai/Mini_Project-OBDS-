<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blood Donation App</title>
  <link rel="stylesheet" href="../CSS/style.css">
</head>
<body style="
  margin:0;
  height:100vh;
  background-image: url('../Images/hos.jpg');
  background-repeat: no-repeat;
  background-position: center center;
  background-size: cover;
">


  <!-- Welcome Page -->
  <div id="welcomePage" class="page">
    <div class="container">
      <h3 id="welcome">WELCOME !</h3>
      <img src="../Images/Gemini_Generated_Image_496ntn496ntn496n.png" alt="Logo" class="logo">
      <p style="color: white;">Giving blood is giving life <br>and reflect true Bhutanese <br>compassion.</p><br>
      <br>
      <br>
      <button onclick="showLogin()">GET STARTED</button>
      <br>
    </div>
  </div>

  <!-- Login Page -->
  <div id="loginPage" class="page hidden">
    <div class="container">
      <h2 style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif";>WELCOME BACK!</h2>
      <img src="../Images/Gemini_Generated_Image_496ntn496ntn496n.png" alt="Logo" class="logo">
      <input type="text" placeholder="Username">
      <input type="password" placeholder="Password">
      
      <div class="row">
        <label><input type="checkbox"> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>

      <button class="login">Login</button>

      <p>Don't have an account? <a href="#">Sign Up</a></p>
    </div>
  </div>

  <script>
    function showLogin() {
      document.getElementById("welcomePage").classList.add("hidden");
      document.getElementById("loginPage").classList.remove("hidden");
    }
  </script>
</body>
</html>

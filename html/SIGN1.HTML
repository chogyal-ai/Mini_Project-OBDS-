<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Blood Transfusion Information System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            height: 100vh; /* Full height */
            display: flex;
            justify-content: center; /* Center horizontally */
            align-items: center; /* Center vertically */
            background-image: url('../image/home4.jpg'); /* Replace with your image URL */
            background-size: cover; /* Cover the entire viewport */
            background-position: center; /* Center the image */
            color: white; /* Text color */
        }

        .login-container {
            background-color: rgba(255, 255, 255, 0.9); /* Semi-transparent white background */
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            width: 300px; /* Fixed width for the login box */
            text-align: center;
        }

        .login-container h2 {
            margin: 0 0 20px;
            color: #D40026; /* Title color matching the background */
        }

        .login-container input[type="text"],
        .login-container input[type="password"] {
            width: 100%; /* Full width input */
            padding: 10px;
            margin: 10px 0; /* Margin for spacing */
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .login-container button {
            width: 100%; /* Full width button */
            padding: 10px;
            background-color: #D40026; /* Button color */
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .login-container button:hover {
            background-color: #A0001D; /* Darker shade on hover */
        }

        .remember-me {
            text-align: left; /* Align text to the left */
            margin: 10px 0; /* Margin for spacing */
            color: black;
        }

        .footer-note {
            margin-top: 15px;
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>ONLINE BLOOD DONATION SYSTEM</h2>
        <p>SIGN IN TO START YOUR SESSION</p>
        <form>
            <input type="text" placeholder="Email" required>
            <input type="password" placeholder="Password" required>
            <div class="remember-me">
                <label>
                    <input type="checkbox"> Remember Me
                </label>
            </div>
            <button type="submit"><i class="fas fa-sign-in-alt"></i> LOGIN</button>
        </form>
        <p class="footer-note"><a href="forgot.html" style="color: #D40026; text-decoration: none;">Forgot Password</a></p>
    </div>

</body>
</html>
